# 千夜智子 · 模型无关配置
# 切换调用方式只需改 provider 段；代码零改动。

provider:
  type: mlx                   # api = 云端 API；local = 本地服务（Ollama / LM Studio）；mlx = 进程内推理（Apple Silicon，不起服务）
  # —— mlx（进程内）：model 为 HF 仓库或本地 MLX 权重路径 ——
  model: "/Users/dango_studio/.lmstudio/models/lmstudio-community/Qwen3.8-27B-MLX-4bit"
#  model: "/Users/dango_studio/.lmstudio/models/lmstudio-community/Qwen3-Next-80B-A3B-Instruct-MLX-4bit"
#  model: "/Users/dango_studio/.lmstudio/models/lmstudio-community/gemma-4-26B-A4B-it-QAT-MLX-4bit"
  temperature: 0.85
  max_tokens: 1024            # 单次回复生成上限
  enable_thinking: false      # 对话关思考：更快；true 时需加大 max_tokens，防思考截断空回复
  multimodal: auto            # auto=按权重里的视觉塔判定能不能看图（config 只当线索，转换时漏了视觉塔的权重会被识破）；true/false 强制开启/关闭
  model_dir: "/Users/dango_studio/.lmstudio/models"  # 模型切换器扫描根目录（各发布者子目录会被一并扫描）

  # —— 本地服务示例：type 改 local 并换成下面配置 ——
  # base_url: "http://localhost:1234/v1"   # LM Studio
  # model: "google/gemma-4-26b-a4b-qat"
  # api_key: "ollama"

  # —— 云端 API 示例：type 改 api 并换成下面配置 ——
  # base_url: "https://ark.cn-beijing.volces.com/api/v3"  # 豆包·火山方舟
  # model: "doubao-seed-1.6"
  # api_key: "${ARK_API_KEY}"

memory:
  engine: "sqlite_bm25"     # v2：SQLite 持久化 + BM25 倒排检索（零依赖）；旧 JSONL 首次启动自动迁移
  note_file: "notes"        # 「观测笔记」目录（每用户一个子目录，内含 notes.db）
  top_k: 5                  # 每轮最多注入的笔记条数

attachments:
  caption: true             # 图片内容一句话说明（VLM 描述）：随该轮写进记忆，她记得你给她看过什么
                            # false = 只记 [图片] 不做描述（省一次视觉调用；图仍然落盘可回看）
                            # 落盘位置 notes/<user_id>/<角色>/images/，历史只存文件名（不进上下文）

visual_identity:
  card: "visual/identity.json"        # 自视身份卡：角色视觉特征（字符级置信度匹配基准）
  reference_dir: "visual/references"  # 参考图目录（可选：配合身份卡 reference_images，做视觉比对）
  threshold: 0.55                     # 置信度 ≥ 此值 → 判定「图片中可能有我」

# ── 按需联网搜索（文本协议触发，不需要模型支持 function calling）─────
# 模型觉得信息有时效性（新闻/比分/价格/近况）才输出 <search>查询</search>，
# 系统代查（Bing HTML，免 key 零依赖）并把结果喂回去；查不到就当没查过。
# 是否对某角色启用由 characters.<角色>.search 单独控制。
web_search:
  enabled: true            # 总开关：false = 所有角色都没有这个能力
  top_k: 3                 # 每次注入 system 的结果条数（1-8）
  max_calls_per_turn: 1    # 每轮最多查几次（1-3；模型吐多个标签也只认这么多）
  timeout: 5.0             # 单次搜索超时（秒）；超时按「没查到」降级

# ── 角色注册表（一级：用户 / 二级：角色）────────────────────────────
# 每个角色独立 System Prompt + 独立记忆命名空间（notes/<user_id>/<角色>/）：
# - prompt:          人物卡文件（纯文本 / Markdown，或 `SYS_PROMPT = r'''...'''` 包装，无需改卡）
# - visual_identity: 自视身份卡路径；留空 = 该角色无自视身份（不自识别）
# - memory:          是否启用「观测笔记」五维记忆（主动观测用户是智子的专属能力）
# - search:          是否启用「按需联网搜索」（另需全局 web_search.enabled）
# - default:         默认角色（一次请求角色留空时落到它，并沿用一级目录 notes/<user_id>）
characters:
  千夜智子:
    prompt: "prompts/zhizi_v1.md"
    visual_identity: "visual/identity.json"
    memory: true
    search: true
    default: true
  白鸥:
    prompt: "prompts/白鸥人物卡-万物皆数定制版.txt"
    visual_identity: ""       # 无自视身份卡
    memory: false             # 不主动观测用户（观测笔记是智子专有）
    search: false             # 不需要联网搜索

# 旧版单角色回退（无 characters 段时生效）
system_prompt: "prompts/zhizi_v1.md"

router:
  enabled: false            # 路由层后置，默认关闭（小模型语域/插件判断）
  model: "doubao-lite"

server:
  host: "127.0.0.1"         # API 监听地址；局域网/公网部署时按需修改
  port: 8765
  api_key: ""               # 留空=不鉴权；非空时 /chat 需带 Authorization: Bearer <api_key>

observability:
  log_file: "logs/zhizi.log"  # 结构化日志文件；留空=只打 stderr
  level: "INFO"               # DEBUG / INFO / WARNING / ERROR
  dashboard: true             # 暴露 GET /dashboard 实时监控页
