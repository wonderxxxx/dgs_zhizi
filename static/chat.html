<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>千夜智子 · 聊天</title>
<style>
  :root {
    --bg: #0f1115; --panel: #171a21; --border: #2a2f3a;
    --text: #e6e9ef; --muted: #8b93a7; --accent: #7aa2ff;
    --ok: #3dd68c; --err: #f31260;
    --user-bubble: #22304a; --bot-bubble: #1c2029;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0; font: 14px/1.6 -apple-system, "SF Pro Text", "PingFang SC", sans-serif;
    background: var(--bg); color: var(--text);
    display: flex; flex-direction: column;
  }
  header {
    display: flex; align-items: center; justify-content: space-between; gap: 12px;
    padding: 12px 20px; border-bottom: 1px solid var(--border);
    background: var(--panel); flex-wrap: wrap;
  }
  header h1 { margin: 0; font-size: 16px; font-weight: 600; white-space: nowrap; }
  .dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%;
    background: var(--muted); margin-right: 8px; }
  .dot.on { background: var(--ok); box-shadow: 0 0 8px var(--ok); }
  .dot.off { background: var(--err); }
  .controls { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
  .controls label { color: var(--muted); font-size: 12px; display: flex; align-items: center; gap: 6px; }
  select {
    background: var(--bg); border: 1px solid var(--border); color: var(--text);
    border-radius: 8px; padding: 5px 8px; font: inherit; font-size: 12px; outline: none;
    max-width: 200px;
  }
  select:focus { border-color: var(--accent); }
  .vision-pill { padding: 1px 8px; border-radius: 999px; font-size: 11px;
    border: 1px solid var(--border); }
  .vision-pill.v { color: var(--ok); border-color: #1d5c3f; }
  .vision-pill.no { color: var(--muted); }
  input[type="text"], input[type="password"] {
    background: var(--bg); border: 1px solid var(--border); color: var(--text);
    border-radius: 8px; padding: 6px 10px; font: inherit; width: 110px; outline: none;
  }
  input:focus { border-color: var(--accent); }
  button {
    background: var(--panel); border: 1px solid var(--border); color: var(--text);
    border-radius: 8px; padding: 6px 12px; font: inherit; cursor: pointer;
  }
  button:hover { border-color: var(--accent); color: var(--accent); }
  .pill { display: inline-block; padding: 1px 8px; border-radius: 999px;
    background: #222836; border: 1px solid var(--border); font-size: 11px; color: var(--muted); }

  #messages {
    flex: 1; overflow-y: auto; padding: 20px; max-width: 860px;
    width: 100%; margin: 0 auto; display: flex; flex-direction: column; gap: 14px;
  }
  .msg { display: flex; flex-direction: column; max-width: 78%; }
  .msg .who { font-size: 11px; color: var(--muted); margin-bottom: 4px; }
  .msg .bubble {
    padding: 10px 14px; border-radius: 14px; white-space: pre-wrap;
    word-break: break-word; border: 1px solid var(--border);
  }
  .msg.user { align-self: flex-end; align-items: flex-end; }
  .msg.user .bubble { background: var(--user-bubble); border-color: #2c3d5c; border-bottom-right-radius: 4px; }
  .msg.bot { align-self: flex-start; align-items: flex-start; }
  .msg.bot .bubble { background: var(--bot-bubble); border-bottom-left-radius: 4px; }
  .msg .actions {
    margin-top: 6px; font-size: 12px; color: var(--muted); font-style: italic;
    white-space: pre-wrap; line-height: 1.5;
  }
  .msg .caption {
    margin-top: 6px; font-size: 11px; color: var(--muted);
    border-left: 2px solid var(--border); padding-left: 8px;
  }
  .msg .time { font-size: 10px; color: var(--muted); margin-top: 4px; opacity: .7; }
  .msg.error .bubble { background: #2a1520; border-color: #5c2438; color: #ff8fa8; }
  .typing { display: inline-flex; gap: 5px; align-items: center; padding: 4px 2px; }
  .typing i {
    width: 6px; height: 6px; border-radius: 50%; background: var(--muted);
    animation: blink 1.2s infinite both;
  }
  .typing i:nth-child(2) { animation-delay: .2s; }
  .typing i:nth-child(3) { animation-delay: .4s; }
  @keyframes blink { 0%, 80%, 100% { opacity: .2; } 40% { opacity: 1; } }
  .empty { color: var(--muted); text-align: center; margin-top: 40px; font-size: 13px; }
  .note { color: var(--muted); text-align: center; font-size: 11px; opacity: .8; }

  footer {
    border-top: 1px solid var(--border); background: var(--panel);
    padding: 14px 20px 18px;
  }
  .input-row {
    max-width: 860px; margin: 0 auto; display: flex; gap: 10px; align-items: flex-end;
  }
  #input {
    flex: 1; resize: none; min-height: 44px; max-height: 160px;
    background: var(--bg); border: 1px solid var(--border); color: var(--text);
    border-radius: 12px; padding: 11px 14px; font: inherit; line-height: 1.5; outline: none;
  }
  #input:focus { border-color: var(--accent); }
  #send {
    background: var(--accent); border-color: var(--accent); color: #0f1115;
    font-weight: 600; padding: 11px 18px; border-radius: 12px;
  }
  #send:disabled { opacity: .5; cursor: not-allowed; }
  #send:hover:not(:disabled) { color: #0f1115; filter: brightness(1.1); }
  .hint { max-width: 860px; margin: 6px auto 0; color: var(--muted); font-size: 11px; }
  #attachments { display: flex; gap: 8px; flex-wrap: wrap; max-width: 860px; margin: 0 auto 8px; }
  .att {
    position: relative; border: 1px solid var(--border); border-radius: 10px;
    overflow: hidden; background: var(--bg);
  }
  .att img { display: block; max-height: 88px; max-width: 120px; object-fit: cover; }
  .att .drop { position: absolute; inset: 0; display: flex; align-items: center;
    justify-content: center; gap: 4px; color: var(--muted); font-size: 11px;
    background: rgba(15,17,21,.72); cursor: pointer; }
  .att .drop .x { color: var(--err); font-weight: 700; }
  #pick {
    background: var(--panel); border: 1px dashed var(--border); color: var(--muted);
    border-radius: 10px; padding: 8px 12px; font-size: 12px; cursor: pointer;
  }
  #pick:hover { color: var(--accent); border-color: var(--accent); }
  .msg .bubble img { max-width: 100%; max-height: 320px; border-radius: 8px;
    display: block; margin-bottom: 6px; }
  .no-vision { color: var(--muted); font-size: 12px; margin: 4px 0; }

  /* ---------- 导出选择弹窗 ---------- */
  .modal { position: fixed; inset: 0; z-index: 50; padding: 20px;
    background: rgba(6,8,11,.68); display: none; align-items: center; justify-content: center; }
  .modal.open { display: flex; }
  .modal-card { background: var(--panel); border: 1px solid var(--border); border-radius: 14px;
    width: 100%; max-width: 620px; max-height: 86vh; display: flex; flex-direction: column;
    box-shadow: 0 18px 50px rgba(0,0,0,.55); }
  .modal-head { display: flex; align-items: center; justify-content: space-between; gap: 10px;
    padding: 14px 16px; border-bottom: 1px solid var(--border); }
  .modal-head h2 { margin: 0; font-size: 15px; font-weight: 600; }
  .modal-head .count { color: var(--muted); font-size: 12px; font-variant-numeric: tabular-nums; }
  .pick-bar { display: flex; align-items: center; gap: 8px; flex-wrap: wrap;
    padding: 10px 16px; border-bottom: 1px solid var(--border); }
  .pick-bar button { padding: 4px 10px; font-size: 12px; }
  .pick-bar input[type="search"] { flex: 1; min-width: 130px; background: var(--bg);
    border: 1px solid var(--border); color: var(--text); border-radius: 8px;
    padding: 5px 10px; font: inherit; font-size: 12px; outline: none; }
  .pick-bar input[type="search"]:focus { border-color: var(--accent); }
  .pick-list { overflow-y: auto; padding: 6px; flex: 1; min-height: 120px; }
  .pick-row { display: flex; gap: 10px; align-items: flex-start; padding: 8px 10px;
    border-radius: 8px; cursor: pointer; }
  .pick-row:hover { background: #1e232d; }
  .pick-row.on { background: #1b2333; }
  .pick-row input { margin-top: 3px; flex: none; accent-color: var(--accent); }
  .pick-row .txt { min-width: 0; flex: 1; }
  .pick-row .meta { color: var(--muted); font-size: 11px; display: flex; gap: 6px;
    align-items: center; flex-wrap: wrap; }
  .pick-row .tag { border: 1px solid var(--border); border-radius: 999px; padding: 0 6px; font-size: 10px; }
  .pick-row .tag.u { color: var(--accent); border-color: #2c3d5c; }
  .pick-row .tag.b { color: var(--ok); border-color: #1d5c3f; }
  .pick-row .body { font-size: 12px; color: var(--text); margin-top: 2px; white-space: pre-wrap;
    word-break: break-word; display: -webkit-box; -webkit-line-clamp: 2;
    -webkit-box-orient: vertical; overflow: hidden; }
  .modal-foot { display: flex; align-items: center; justify-content: space-between; gap: 10px;
    padding: 12px 16px; border-top: 1px solid var(--border); flex-wrap: wrap; }
  .modal-foot .est { color: var(--muted); font-size: 11px; }
  .modal-foot .est.bad { color: var(--err); }
  .modal-foot .btns { display: flex; gap: 8px; }
  #expGo { background: var(--accent); border-color: var(--accent); color: #0f1115; font-weight: 600; }
  #expGo:disabled { opacity: .5; cursor: not-allowed; }
  #expGo:hover:not(:disabled) { color: #0f1115; filter: brightness(1.1); }
</style>
</head>
<body>
<header>
  <h1><span id="live" class="dot"></span>千夜智子 · 聊天</h1>
  <div class="controls">
    <label>用户 <select id="userId" title="切换用户（一级隔离：会话与记忆按 user_id 分开）"></select></label>
    <label>角色 <select id="charSelect" title="切换角色（一级用户 / 二级角色，记忆互相隔离）"></select></label>
    <label><input type="checkbox" id="hideActions"/> 隐藏动作</label>
    <label>Key <input type="password" id="apiKey" placeholder="无则留空" style="width:90px"/></label>
    <select id="modelSelect" title="切换模型（mlx 场景释放旧引擎、惰性重载）"></select>
    <span class="vision-pill" id="visionPill">…</span>
    <span class="pill" id="histPill" title="已从服务端拉取的聊天记录条数">…</span>
    <button id="export" title="挑选要导出的消息，合成一张 PNG 长图">导出图片</button>
    <button id="clear" title="仅清空本页显示（服务端记忆不受影响）">清屏</button>
  </div>
</header>

<div id="messages">
  <div class="empty" id="empty">打个招呼吧 —— 她记得这个 user_id + 角色 下的所有过往。</div>
</div>

<footer>
  <div id="attachments"></div>
  <div class="input-row">
    <button id="pick" title="上传图片（模型支持多模态时才发送；否则仅本地预览）">＋</button>
    <textarea id="input" rows="1" placeholder="输入消息，Enter 发送，Shift+Enter 换行"></textarea>
    <button id="send">发送</button>
  </div>
  <div class="hint">人格与记忆在服务端 · 笔记落盘 notes/&lt;user_id&gt;/&lt;角色&gt;/ · 一级用户 × 二级角色，互相隔离</div>
</footer>

<div class="modal" id="expModal">
  <div class="modal-card" role="dialog" aria-modal="true" aria-label="选择要导出的消息">
    <div class="modal-head">
      <h2>选择要导出的内容</h2>
      <span class="count" id="expCount">已选 0 / 0</span>
    </div>
    <div class="pick-bar">
      <button id="expAll" title="全选（带搜索时只作用于当前列出的）">全选</button>
      <button id="expNone" title="全不选">全不选</button>
      <button id="expInv" title="反选">反选</button>
      <input type="search" id="expSearch" placeholder="搜索内容…"/>
    </div>
    <div class="pick-list" id="expList"></div>
    <div class="modal-foot">
      <span class="est" id="expEst"></span>
      <div class="btns">
        <button id="expCancel">取消</button>
        <button id="expGo">导出长图</button>
      </div>
    </div>
  </div>
</div>

<script>
const $ = (id) => document.getElementById(id);
const messagesEl = $('messages'), inputEl = $('input'), sendEl = $('send');
const attachEl = $('attachments'), pickEl = $('pick');
let busy = false;
let vision = false;      // 当前模型是否多模态（/health 报告）
let histKey = '';        // 已拉取历史的 (user × character) 键：同一对不重复拉
const pendingImgs = [];  // 已选但未发送的图片 {dataUrl, mime, data}
// 当前会话的消息镜像（服务端历史 + 本轮新发的），供导出图片用
// 条目：{role, content, actions, ts, images, caption, blobs}
const chatLog = [];

const NEW_USER = '＋ 新用户…';
let userName = (localStorage.getItem('zhizi_user_id') || '').trim() || 'default';
let userList = ['default'];   // 服务端已知用户（GET /users）
const extraUsers = [];        // 本页新建、服务端尚未落盘的用户
const savedKey = localStorage.getItem('zhizi_api_key');
if (savedKey) $('apiKey').value = savedKey;
let charName = localStorage.getItem('zhizi_character') || '';

$('userId').addEventListener('change', (e) => {
  const sel = e.target;
  if (sel.value === NEW_USER) {
    const v = (prompt('新用户 id（她的会话与记忆将独立于其他人）') || '').trim();
    if (!v) { sel.value = userName; return; }
    if (!extraUsers.includes(v)) extraUsers.push(v);
    userName = v;
    sel.dataset.sig = '';   // 强制重绘
    renderUsers();
    loadHistory();
    return;
  }
  userName = sel.value || 'default';
  localStorage.setItem('zhizi_user_id', userName);
  loadHistory();
});
$('apiKey').addEventListener('change', () => {
  localStorage.setItem('zhizi_api_key', $('apiKey').value.trim());
  loadHistory(true);   // Key 之前填错导致 401：改对后重拉一次
});
$('charSelect').addEventListener('change', () => {
  charName = $('charSelect').value;
  localStorage.setItem('zhizi_character', charName);
  loadHistory();
});

function now() { return new Date().toLocaleTimeString([], {hour:'2-digit', minute:'2-digit'}); }

function stampOf(iso) {
  // 历史消息带服务端 ISO 时间戳；缺失或坏格式时退回本地当前时间
  if (!iso) return now();
  const d = new Date(iso);
  return isNaN(d.getTime()) ? now() : d.toLocaleTimeString([], {hour:'2-digit', minute:'2-digit'});
}

function escapeHtml(s) {
  return s.replace(/[&<>]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
}

function dataUrlToParts(url) {
  const m = url.match(/^data:([^;]+);base64,(.*)$/s);
  return m ? {mime: m[1], data: m[2]} : null;
}

function renderAttachments() {
  attachEl.innerHTML = '';
  pendingImgs.forEach((img, i) => {
    const div = document.createElement('div');
    div.className = 'att';
    div.innerHTML = `<img src="${img.dataUrl}">
      <div class="drop" title="移除"><span class="x">✕</span></div>`;
    div.querySelector('.drop').addEventListener('click', () => {
      pendingImgs.splice(i, 1); renderAttachments();
    });
    attachEl.appendChild(div);
  });
}

pickEl.addEventListener('click', () => {
  const input = document.createElement('input');
  input.type = 'file'; input.accept = 'image/*'; input.multiple = true;
  input.onchange = () => {
    for (const f of input.files) {
      const fr = new FileReader();
      fr.onload = () => {
        const parts = dataUrlToParts(fr.result);
        if (parts && pendingImgs.length < 4) pendingImgs.push({dataUrl: fr.result, ...parts});
        renderAttachments();
      };
      fr.readAsDataURL(f);
    }
  };
  input.click();
});

function appendCaption(el, caption) {
  if (!caption) return;
  const c = document.createElement('div');
  c.className = 'caption';
  c.textContent = '图片内容：' + caption;
  el.appendChild(c);
}

function addMsg(role, text, actions, meta, noLog) {
  // meta: {ts, images:[{name,mime}], caption}——历史回填用（服务端给的原图 + 内容说明）
  meta = meta || {};
  $('empty')?.remove();
  // 错误提示与界面提示不进导出；noLog 用于「已切换到模型」这类非聊天内容
  if (!noLog && role !== 'error') {
    chatLog.push({role, content: text, actions: actions || [], ts: meta.ts || '',
                  images: meta.images || [], caption: meta.caption || ''});
  }
  const el = document.createElement('div');
  el.className = 'msg ' + role;
  const who = role === 'user'
    ? userName
    : (charName || '智子');
  let html = `<div class="who">${escapeHtml(who)}</div><div class="bubble"></div>`;
  el.innerHTML = html;
  el.querySelector('.bubble').textContent = text;
  if (actions && actions.length) {
    const a = document.createElement('div');
    a.className = 'actions';
    a.textContent = actions.join('\n');
    el.appendChild(a);
  }
  if (meta.caption) {
    appendCaption(el, meta.caption);
  }
  if (meta.images && meta.images.length) {
    const bubble = el.querySelector('.bubble');
    const frag = document.createDocumentFragment();
    meta.images.forEach((ref) => {
      const img = document.createElement('img');
      img.alt = '图片';
      frag.appendChild(img);
      fillImage(img, ref);
    });
    bubble.insertBefore(frag, bubble.firstChild);
  }
  const t = document.createElement('div');
  t.className = 'time';
  t.textContent = meta.ts ? stampOf(meta.ts) : now();
  el.appendChild(t);
  messagesEl.appendChild(el);
  messagesEl.scrollTop = messagesEl.scrollHeight;
  return el;
}

function addMsgWithImages(role, imgs, text, actions) {
  const el = addMsg(role, text, actions);
  const bubble = el.querySelector('.bubble');
  imgs.forEach((url) => {
    const img = document.createElement('img');
    img.src = url;
    bubble.prepend(img);
  });
  // 刚发的图还在内存里（服务端落盘前），记下 dataUrl 供导出
  const rec = chatLog[chatLog.length - 1];
  if (rec && imgs.length) rec.blobs = imgs.slice();
  return el;
}

function addTyping() {
  const el = document.createElement('div');
  el.className = 'msg bot';
  el.innerHTML = `<div class="who">${escapeHtml(charName || '智子')}</div><div class="bubble"><span class="typing"><i></i><i></i><i></i></span></div>`;
  messagesEl.appendChild(el);
  messagesEl.scrollTop = messagesEl.scrollHeight;
  return el;
}

function addNote(text) {
  $('empty')?.remove();
  const el = document.createElement('div');
  el.className = 'note';
  el.textContent = text;
  messagesEl.appendChild(el);
  return el;
}

function setBusy(v) {
  busy = v;
  sendEl.disabled = v;
  inputEl.disabled = v;
}

function authHeaders() {
  const h = {'Content-Type': 'application/json'};
  const key = $('apiKey').value.trim();
  if (key) h['Authorization'] = 'Bearer ' + key;
  return h;
}

function histKeyOf() { return userName + '\u0000' + (charName || ''); }

// 历史里的原图：走 /image（要带鉴权头，<img> 带不了）→ blob URL
const imageUrls = [];
function releaseImages() {
  while (imageUrls.length) URL.revokeObjectURL(imageUrls.pop());
}
async function fillImage(img, ref) {
  try {
    const q = new URLSearchParams({user_id: userName, name: ref.name});
    if (charName) q.set('character', charName);
    const r = await fetch('/image?' + q.toString(), {headers: authHeaders()});
    if (!r.ok) throw new Error('HTTP ' + r.status);
    const url = URL.createObjectURL(await r.blob());
    imageUrls.push(url);
    img.src = url;
  } catch (_) {
    const miss = document.createElement('div');
    miss.className = 'no-vision';
    miss.textContent = '（原图读不到，可能已被清理）';
    img.replaceWith(miss);
  }
}

async function loadHistory(force) {
  // 同一 (user_id, character) 只拉一次：换用户/换角色/换 Key 时才重拉（force）
  if (busy) return;  // 正在对话：不打断本轮气泡
  const key = histKeyOf();
  if (!force && key === histKey) return;
  try {
    const q = new URLSearchParams({user_id: userName, limit: '200'});
    if (charName) q.set('character', charName);
    const r = await fetch('/history?' + q.toString(), {headers: authHeaders()});
    const d = await r.json();
    // 键未变才记账（含 HTTP 错误：避免鉴权失败时每 5s 轮询重试）；
    // 期间切了用户/角色则这次结果作废，交给新键那一次拉取。
    const stale = !currentKeyIs(key);
    if (!stale) histKey = key;
    if (stale || !r.ok) return;
    renderHistory(d);
  } catch (_) {
    // 网络/服务未就绪：不改键，交给下一轮轮询重试
  }
}

function currentKeyIs(key) { return histKeyOf() === key; }

function renderHistory(d) {
  const msgs = Array.isArray(d.messages) ? d.messages : [];
  releaseImages();
  messagesEl.innerHTML = '';
  chatLog.length = 0;   // 与 DOM 一起重置：换用户/换角色/重拉时别把旧记录留在导出里
  $('histPill').textContent = msgs.length ? `历史 ${msgs.length}` : '无历史';
  if (!msgs.length) {
    messagesEl.innerHTML = `<div class="empty" id="empty">${
      d.persisted ? '这个 user_id × 角色还没有往来 —— 打个招呼吧。'
                  : '该角色不启用观测笔记（记录不落盘，仅当前进程有效）。'}</div>`;
    return;
  }
  msgs.forEach((m) => addMsg(m.role, m.content, m.actions,
    {ts: m.time, images: m.images, caption: m.caption}));
  if (!d.persisted) {
    addNote('该角色未启用观测笔记：历史只在当前进程内，重启即失。');
  }
  messagesEl.scrollTop = messagesEl.scrollHeight;
}

async function send() {
  const text = inputEl.value.trim();
  const imgs = pendingImgs.slice();
  if ((!text && !imgs.length) || busy) return;
  inputEl.value = '';
  inputEl.style.height = 'auto';
  pendingImgs.length = 0; renderAttachments();

  // 模型不支持多模态时：图片仅本地预览，不发给服务端（动态降级）
  const sendImgs = imgs.map(({mime, data}) => ({mime, data}));
  const shownImgs = imgs.map(({dataUrl}) => dataUrl);
  let note = null;
  if (imgs.length && !vision) {
    note = '（当前模型不支持多模态，图片仅预览未发送）';
  }
  const sent = addMsgWithImages('user', shownImgs, note ? (text ? text + '\n' + note : note) : text);
  setBusy(true);
  const typing = addTyping();
  try {
    const headers = authHeaders();
    const payload = {
      message: text,
      user_id: userName,
      character: charName || undefined,
      hide_actions: $('hideActions').checked,
    };
    if (imgs.length && vision) payload.attachments = sendImgs;
    const r = await fetch('/chat', {
      method: 'POST',
      headers,
      body: JSON.stringify(payload),
    });
    const data = await r.json();
    typing.remove();
    if (!r.ok) throw new Error(data.error || ('HTTP ' + r.status));
    // 服务端实际未受理图片时降级提示
    if (imgs.length && vision && data.image_acked === false) {
      addMsg('error', '服务端未受理图片（模型不支持多模态）');
    }
    // 服务端已把图落盘 + 写了内容说明：立刻补上（刷新后也能看到）
    if (data.attachments && data.attachments.caption) {
      appendCaption(sent, data.attachments.caption);
      const rec = chatLog[chatLog.length - 1];
      if (rec) rec.caption = data.attachments.caption;
    }
    addMsg('bot', data.reply || '(空回复)', data.actions);
  } catch (e) {
    typing.remove();
    addMsg('error', '出错了：' + (e.message || e));
  } finally {
    setBusy(false);
    if (!currentKeyIs(histKey)) loadHistory();  // 对话期间切了用户/角色：补拉新的一对
    inputEl.focus();
  }
}

sendEl.addEventListener('click', send);
inputEl.addEventListener('keydown', (e) => {
  if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); send(); }
});
inputEl.addEventListener('input', () => {
  inputEl.style.height = 'auto';
  inputEl.style.height = Math.min(inputEl.scrollHeight, 160) + 'px';
});
$('clear').addEventListener('click', () => {
  releaseImages();
  messagesEl.innerHTML = '<div class="empty" id="empty">已清屏（服务端记忆保留）。</div>';
  $('histPill').textContent = '已清屏';
});

// ---------- 导出聊天记录为 PNG（Canvas 手绘，零新依赖） ----------
// 页面本身不能直接转图（没有 html2canvas，也不引 CDN），所以照着上面的 CSS
// 把每条消息重新画一遍：布局先算一遍量高度，再画——避免画到一半才发现画布不够高。
const EXP_W = 900;        // 导出宽度（与页面 860px 内容区对齐）
const EXP_PAD = 20;
const EXP_HEAD = 84;      // 顶部标题栏高度
const EXP_MAXDIM = 40000; // 画布单边上限（探测后会被 canvasBudget() 收紧）
// iOS Safari 的画布面积上限只有 16777216 px，超了 toBlob 直接返回 null；
// 桌面 Chrome 大得多。先探测一次真实上限，探不到就用 iOS 安全值。
const EXP_MIN_SCALE = 0.5; // 再小字就糊了，低于此值判为放不下
const expUrls = [];       // 导出期间临时 blob URL，画完统一回收

function fontOf(size, weight, italic) {
  return (italic ? 'italic ' : '') + (weight || 400) + ' ' + size +
         'px -apple-system, "SF Pro Text", "PingFang SC", sans-serif';
}
function cssVar(n) {
  return getComputedStyle(document.documentElement).getPropertyValue(n).trim();
}
function dateShort(iso) {
  // 服务端时间戳是无时区的 ISO，按本地时间解析；缺失/坏格式都退回当前时间（与页面一致）
  const d = new Date(iso || '');
  const use = isNaN(d.getTime()) ? new Date() : d;
  return (use.getMonth() + 1) + '-' + String(use.getDate()).padStart(2, '0') + ' ' +
         use.toLocaleTimeString([], {hour: '2-digit', minute: '2-digit'});
}
function fileStamp() {
  const d = new Date(), p = (n) => String(n).padStart(2, '0');
  return d.getFullYear() + p(d.getMonth() + 1) + p(d.getDate()) + '-' + p(d.getHours()) + p(d.getMinutes());
}
function safeName(s) {
  return (s || 'chat').replace(/[\\/:*?"<>|\s]+/g, '_').slice(0, 40);
}

// 折行：中日韩字符与 emoji 可任意处断行，拉丁文按词断行（canvas 无 word-wrap）
const CJK = /[\u1100-\u11FF\u2E80-\u303F\u3040-\u30FF\u3130-\u318F\u3400-\u4DBF\u4E00-\u9FFF\uA960-\uA97F\uAC00-\uD7FF\uF900-\uFAFF\uFE30-\uFE4F\uFF00-\uFF60\u{1F000}-\u{1FAFF}]/u;
function tokenize(s) {
  const toks = [];
  let buf = '';
  for (const ch of s) {
    if (ch === '\n') { if (buf) { toks.push(buf); buf = ''; } toks.push('\n'); }
    else if (CJK.test(ch)) { if (buf) { toks.push(buf); buf = ''; } toks.push(ch); }
    else if (ch === ' ') { if (buf) { buf += ch; } else { buf = ch; } toks.push(buf); buf = ''; }
    else buf += ch;
  }
  if (buf) toks.push(buf);
  return toks;
}
function wrapText(ctx, text, maxW) {
  const lines = [];
  let cur = '';
  const trim = (s) => s.replace(/ +$/, '');
  for (const t of tokenize(text)) {
    if (t === '\n') { lines.push(trim(cur)); cur = ''; continue; }  // 保留空行（对应 pre-wrap）
    if (ctx.measureText(cur + t).width <= maxW) { cur += t; continue; }
    if (t === ' ') { if (cur) lines.push(trim(cur)); cur = ''; continue; }  // 行尾空格丢掉
    if (cur) { lines.push(trim(cur)); cur = ''; }
    if (ctx.measureText(t).width <= maxW) { cur = t; continue; }
    let piece = '';  // 超长单词：逐字符硬切
    for (const ch of t) {
      if (piece && ctx.measureText(piece + ch).width > maxW) { lines.push(trim(piece)); piece = ch; }
      else piece += ch;
    }
    cur = piece;
  }
  if (cur) lines.push(trim(cur));
  return lines;
}
const widest = (ctx, ls) => ls.reduce((a, l) => Math.max(a, ctx.measureText(l).width), 0);
// 圆角矩形；tail 指哪个角收成 4px（与 .bubble 的单角收齐一致）
function roundRectPath(ctx, x, y, w, h, r, tail) {
  const [tl, tr, br, bl] = tail === 'br' ? [r, r, 4, r] : [r, r, r, 4];
  ctx.beginPath();
  ctx.moveTo(x + tl, y);
  ctx.lineTo(x + w - tr, y); ctx.arcTo(x + w, y, x + w, y + tr, tr);
  ctx.lineTo(x + w, y + h - br); ctx.arcTo(x + w, y + h, x + w - br, y + h, br);
  ctx.lineTo(x + bl, y + h); ctx.arcTo(x, y + h, x, y + h - bl, bl);
  ctx.lineTo(x, y + tl); ctx.arcTo(x, y, x + tl, y, tl);
  ctx.closePath();
}

// 量一条消息的排版，返回 {h, paint(ctx, y0)}
function layoutMsg(ctx, m, imgs, T, hideActions) {
  const isUser = m.role === 'user';
  const colW = EXP_W - EXP_PAD * 2;
  const maxW = colW * 0.78;          // 同 .msg { max-width: 78% }（只是上限）
  const padX = 14, padY = 10;
  const innerW = maxW - padX * 2;
  const ops = [];
  let y = 0;
  const side = isUser ? 'right' : 'left';
  // 内容列靠哪一侧对齐：user 贴右缘（align-self: flex-end），bot 贴左缘
  const anchor = isUser ? EXP_PAD + colW : EXP_PAD;
  // 宽 w 的块挂在这一侧时的左上角 x（user 从右往左挂，bot 从左往右排）
  const hang = (w) => isUser ? anchor - w : anchor;

  // 名字
  const who = isUser ? userName : (charName || '智子');
  ops.push({k: 'text', t: who, x: anchor, y, font: fontOf(11), color: T.muted, align: side});
  y += 15;

  // 原图缩放（页面上限 320px，导出用 200px 免得一张图占满整页）
  const imFit = [];
  let imgH = 0, imgW = 0;
  imgs.forEach((im) => {
    if (!im || !im.width || !im.height) return;
    const r = Math.min(1, innerW / im.width, 200 / im.height);
    const w = Math.max(1, Math.round(im.width * r)), h = Math.max(1, Math.round(im.height * r));
    imFit.push({im, w, h, y: y + padY + imgH});
    imgH += h + 6;
    imgW = Math.max(imgW, w);
  });
  if (imFit.length) imgH -= 6;

  // 正文
  const body = (m.content || '').replace(/\s+$/, '');
  ctx.font = fontOf(14);
  const lines = body ? wrapText(ctx, body, innerW) : [];
  const textW = widest(ctx, lines);
  const textH = lines.length * 22;
  const textTop = y + padY + imgH + (imFit.length && lines.length ? 6 : 0);
  const bubW = Math.min(colW, Math.max(imgW, textW) + padX * 2);
  const bubH = padY * 2 + imgH + (imFit.length && lines.length ? 6 : 0) + textH;
  const bubX = hang(bubW);

  ops.push({k: 'bubble', x: bubX, y, w: bubW, h: bubH, tail: isUser ? 'br' : 'bl',
            fill: isUser ? T.userBubble : T.botBubble, stroke: isUser ? '#2c3d5c' : T.border});
  imFit.forEach((f) => ops.push({k: 'img', x: bubX + padX, y: f.y, w: f.w, h: f.h, im: f.im}));
  lines.forEach((l, i) => ops.push({k: 'text', t: l, x: bubX + padX, y: textTop + i * 22,
                                    font: fontOf(14), color: T.text, align: 'left'}));
  y += bubH;

  // 动作（斜体，可被「隐藏动作」勾掉）
  if (!hideActions && m.actions && m.actions.length) {
    const t = m.actions.join('\n');
    ctx.font = fontOf(12, null, true);
    const ls = wrapText(ctx, t, maxW);
    const w = widest(ctx, ls);
    const x = hang(w);
    y += 6;
    ls.forEach((l, i) => ops.push({k: 'text', t: l, x, y: y + i * 18,
                                   font: fontOf(12, null, true), color: T.muted, align: 'left'}));
    y += ls.length * 18;
  }

  // 图片内容说明（左竖线 + 缩进，同 .caption）
  if (m.caption) {
    ctx.font = fontOf(11);
    const ls = wrapText(ctx, '图片内容：' + m.caption, maxW - 10);
    const w = widest(ctx, ls);
    const x = hang(w);
    y += 6;
    const h = ls.length * 17;
    ops.push({k: 'vline', x, y, h});
    ls.forEach((l, i) => ops.push({k: 'text', t: l, x: x + 10, y: y + i * 17,
                                   font: fontOf(11), color: T.muted, align: 'left'}));
    y += h;
  }

  // 时间
  y += 4;
  ops.push({k: 'text', t: dateShort(m.ts), x: anchor, y,
            font: fontOf(10), color: T.muted, align: side});
  y += 15;

  return {
    h: y,
    paint(ctx, y0) {
      for (const op of ops) {
        const yy = y0 + op.y;
        if (op.k === 'bubble') {
          ctx.fillStyle = op.fill;
          ctx.strokeStyle = op.stroke;
          ctx.lineWidth = 1;
          roundRectPath(ctx, op.x + .5, yy + .5, op.w - 1, op.h - 1, 14, op.tail);
          ctx.fill();
          ctx.stroke();
        } else if (op.k === 'img') {
          ctx.save();
          roundRectPath(ctx, op.x, yy, op.w, op.h, 8, 'all');
          ctx.clip();
          ctx.drawImage(op.im, op.x, yy, op.w, op.h);
          ctx.restore();
        } else if (op.k === 'vline') {
          ctx.fillStyle = T.border;
          ctx.fillRect(op.x, yy, 2, op.h);
        } else {
          ctx.font = op.font;
          ctx.fillStyle = op.color;
          ctx.textAlign = op.align;
          ctx.fillText(op.t, op.x, yy);
        }
      }
      ctx.textAlign = 'left';
    },
  };
}

function expTheme() {
  return {bg: cssVar('--bg'), panel: cssVar('--panel'), border: cssVar('--border'),
          text: cssVar('--text'), muted: cssVar('--muted'),
          userBubble: cssVar('--user-bubble'), botBubble: cssVar('--bot-bubble')};
}
// 量高度用的度量上下文，全局复用一个（measureText 与画布尺寸无关）
let expMeasure = null;
function measureCtx() {
  if (!expMeasure) {
    const c = document.createElement('canvas');
    c.width = EXP_W;
    c.height = 1;
    expMeasure = c.getContext('2d');
    expMeasure.textBaseline = 'top';
  }
  return expMeasure;
}
// 探测浏览器真实画布上限：iOS Safari 只有 16.7M px，桌面 Chrome 大一个量级。
// 画布申请失败时尺寸会被退回 0 或读回空白，所以写个已知色再读最后 1px 验证。
let expBudget = null;
function canAlloc(w, h) {
  try {
    const c = document.createElement('canvas');
    c.width = w;
    c.height = h;
    const x = c.getContext('2d');
    x.fillStyle = '#010203';
    x.fillRect(w - 1, h - 1, 1, 1);
    const d = x.getImageData(w - 1, h - 1, 1, 1).data;
    return d[0] === 1 && d[1] === 2 && d[2] === 3;
  } catch (_) { return false; }
}
function canvasBudget() {
  if (expBudget) return expBudget;
  const w = EXP_W * 2;   // 按 2x 宽度探测，和实际导出同宽
  for (const c of [[40e6, 40000], [12e6, 16000], [4e6, 4096]]) {
    if (canAlloc(w, Math.floor(c[0] / w))) { expBudget = {px: c[0], dim: c[1]}; return expBudget; }
  }
  expBudget = {px: 4e6, dim: 4096};
  return expBudget;
}
// 整段内容进一张画布时的缩放：优先 2x，装不下就按比例降，最低 EXP_MIN_SCALE。
// 取整最多让两边各进 1px，先留 0.1% 余量，再用定步长兜底（按比例回缩可能
// 因为取整而毫无进展，死循环）。
function planExport(H, msgCount) {
  const b = canvasBudget();
  const lim = Math.min(b.dim / H, Math.sqrt(b.px * 0.999 / (EXP_W * H)));
  let scale = Math.min(2, lim);
  for (let i = 0; i < 24 && Math.round(EXP_W * scale) * Math.round(H * scale) > b.px; i++) {
    scale = Math.max(EXP_MIN_SCALE, scale - 0.02);
  }
  const w = Math.round(EXP_W * scale), h = Math.round(H * scale);
  // 放不下时给个「最多几条」的提示：按当前平均消息高反推
  const cap = Math.max(0, Math.floor(b.px / (EXP_W * EXP_MIN_SCALE) - EXP_HEAD - EXP_PAD) /
                      ((H - EXP_HEAD - EXP_PAD) / Math.max(1, msgCount || 1)));
  return {w, h, scale, fits: lim >= EXP_MIN_SCALE && w * h <= b.px, maxMsgs: Math.floor(cap)};
}

// ---------- 导出选择弹窗 ----------
let expList = [];         // 可导出消息的快照（chatLog 的子集）
let expSel = new Set();   // 勾选的下标
function exportables() {
  return chatLog.filter((m) => m.role === 'user' || m.role === 'assistant' || m.role === 'bot');
}
function previewOf(m) {
  const t = ((m.content || '') + ' ' + (m.actions || '')).replace(/\s+/g, ' ').trim();
  if (t) return t;
  return ((m.blobs || []).length + (m.images || []).length) ? '［图片］' : '（空）';
}
function renderExpList() {
  const q = $('expSearch').value.trim().toLowerCase();
  const box = $('expList');
  box.innerHTML = '';
  let shown = 0;
  expList.forEach((m, i) => {
    if (q && previewOf(m).toLowerCase().indexOf(q) < 0) return;
    shown++;
    const isUser = m.role === 'user';
    const nImg = (m.blobs || []).length + (m.images || []).length;
    const row = document.createElement('label');
    row.className = 'pick-row' + (expSel.has(i) ? ' on' : '');
    const meta = document.createElement('span');
    meta.className = 'meta';
    const tag = document.createElement('span');
    tag.className = 'tag ' + (isUser ? 'u' : 'b');
    tag.textContent = isUser ? userName : (charName || '智子');
    const when = document.createElement('span');
    when.textContent = dateShort(m.ts);
    meta.append(tag, when);
    if (nImg) {
      const g = document.createElement('span');
      g.textContent = '🖼 ' + nImg;
      meta.appendChild(g);
    }
    const body = document.createElement('span');
    body.className = 'body';
    body.textContent = previewOf(m);
    const txt = document.createElement('span');
    txt.className = 'txt';
    txt.append(meta, body);
    const box2 = document.createElement('input');
    box2.type = 'checkbox';
    box2.checked = expSel.has(i);
    box2.addEventListener('change', () => {
      if (box2.checked) expSel.add(i); else expSel.delete(i);
      row.classList.toggle('on', box2.checked);
      syncExpFoot();
    });
    row.append(box2, txt);
    box.appendChild(row);
  });
  if (!shown) {
    const e = document.createElement('div');
    e.className = 'empty';
    e.style.marginTop = '18px';
    e.textContent = q ? '没有匹配的消息。' : '没有可导出的聊天记录。';
    box.appendChild(e);
  }
}
function syncExpFoot() {
  $('expCount').textContent = `已选 ${expSel.size} / ${expList.length}`;
  $('expGo').disabled = !expSel.size;
  const est = $('expEst');
  if (!expSel.size) { est.textContent = ''; est.classList.remove('bad'); return; }
  const picked = expList.filter((_, i) => expSel.has(i));
  const ctx = measureCtx();
  const hideActions = $('hideActions').checked;
  const T = expTheme();
  // 预估高度：图片按 200px 高的占位算（真图还没载下来）
  const place = new Map();
  picked.forEach((m, i) => {
    const n = (m.blobs || []).length + (m.images || []).length;
    if (n) place.set(i, Array.from({length: n}, () => ({width: 320, height: 200})));
  });
  const H = EXP_HEAD + picked.reduce((a, m, i) =>
    a + layoutMsg(ctx, m, place.get(i) || [], T, hideActions).h, 0) + EXP_PAD;
  const p = planExport(H, picked.length);
  est.classList.toggle('bad', !p.fits);
  // 缩放比是浮点，展示时压到 2 位，免得出现 1.2267357882376984 这种
  const sx = Math.round(p.scale * 100) / 100;
  est.textContent = p.fits
    ? `预计 ${p.w} × ${p.h} px（${sx}×）· 单张长图`
    : `太长，单张长图放不下（约 ${p.maxMsgs} 条以内），请减少勾选`;
}
function openExportDialog() {
  expList = exportables();
  expSel = new Set(expList.map((_, i) => i));
  $('expSearch').value = '';
  renderExpList();
  syncExpFoot();
  $('expModal').classList.add('open');
}
function closeExportDialog() { $('expModal').classList.remove('open'); }
// 当前搜索条件下可见的下标（带搜索时全选/全不选/反选只作用于这些）
function visibleIdx() {
  const q = $('expSearch').value.trim().toLowerCase();
  const out = new Set();
  expList.forEach((m, i) => { if (!q || previewOf(m).toLowerCase().indexOf(q) >= 0) out.add(i); });
  return out;
}
function repaint() { renderExpList(); syncExpFoot(); }
$('export').addEventListener('click', openExportDialog);
$('expCancel').addEventListener('click', closeExportDialog);
$('expModal').addEventListener('click', (e) => { if (e.target === $('expModal')) closeExportDialog(); });
$('expGo').addEventListener('click', exportSelected);
$('expSearch').addEventListener('input', repaint);
$('expAll').addEventListener('click', () => { visibleIdx().forEach((i) => expSel.add(i)); repaint(); });
$('expNone').addEventListener('click', () => { visibleIdx().forEach((i) => expSel.delete(i)); repaint(); });

document.addEventListener('keydown', (e) => {
  if (!$('expModal').classList.contains('open')) return;
  if (e.key === 'Escape') closeExportDialog();
  else if (e.key === 'Enter' && !e.target.closest('input, textarea')) {
    if (!$('expGo').disabled) exportSelected();
  }
});


async function collectExportImages(list) {
  const jobs = [];
  list.forEach((m, i) => {
    (m.blobs || []).forEach((src) => jobs.push({i, src}));
    (m.images || []).forEach((ref) => jobs.push({i, ref}));
  });
  const map = new Map();
  await Promise.all(jobs.map(async (j) => {
    let url = j.src;
    if (!url) {
      try {
        const q = new URLSearchParams({user_id: userName, name: j.ref.name});
        if (charName) q.set('character', charName);
        const r = await fetch('/image?' + q.toString(), {headers: authHeaders()});
        if (!r.ok) throw new Error('HTTP ' + r.status);
        url = URL.createObjectURL(await r.blob());
        expUrls.push(url);
      } catch (_) { return; }
    }
    const im = await new Promise((res) => {
      const el = new Image();
      el.onload = () => res(el);
      el.onerror = () => res(null);
      el.src = url;
    });
    if (!im) return;
    if (!map.has(j.i)) map.set(j.i, []);
    map.get(j.i).push(im);
  }));
  return map;
}

async function exportSelected() {
  const btn = $('export');
  const picked = expList.filter((_, i) => expSel.has(i));
  if (!picked.length) { addNote('没有勾选任何内容。'); return; }
  const T = expTheme();
  const hideActions = $('hideActions').checked;
  btn.disabled = true;
  btn.textContent = '导出中…';
  $('expGo').disabled = true;
  $('expModal').classList.remove('open');
  try {
    const imgs = await collectExportImages(picked);

    // 先排版量高（同一套度量上下文，宽度固定）
    const ctx = measureCtx();
    const layouts = picked.map((m, i) => layoutMsg(ctx, m, imgs.get(i) || [], T, hideActions));
    const H = EXP_HEAD + layouts.reduce((a, L) => a + L.h, 0) + EXP_PAD;

    // 单张长图：整段内容进一张画布，清晰度尽量高，实在装不下才降
    const plan = planExport(H);
    if (!plan.fits) {
      throw new Error(`内容太长，单张长图放不下（约 ${plan.maxMsgs} 条以内），请减少勾选`);
    }
    const cv = document.createElement('canvas');
    cv.width = plan.w;
    cv.height = plan.h;
    const c = cv.getContext('2d');
    c.setTransform(plan.scale, 0, 0, plan.scale, 0, 0);
    c.textBaseline = 'top';
    c.fillStyle = T.bg;
    c.fillRect(0, 0, EXP_W, H);

    // 顶部标题栏
    c.textAlign = 'left';
    c.font = fontOf(16, 600);
    c.fillStyle = T.text;
    c.fillText((charName || '智子') + ' · 聊天记录', EXP_PAD, EXP_PAD + 4);
    c.font = fontOf(12);
    c.fillStyle = T.muted;
    c.fillText(`用户 ${userName} · ${dateShort(picked[0].ts)} → ${dateShort(picked[picked.length - 1].ts)}` +
               ` · 共 ${picked.length} 条`, EXP_PAD, EXP_PAD + 30);
    c.fillStyle = T.border;
    c.fillRect(EXP_PAD, EXP_HEAD - 22, EXP_W - EXP_PAD * 2, 1);

    let y = EXP_HEAD;
    layouts.forEach((L) => { L.paint(c, y); y += L.h; });

    const base = safeName((charName || 'zhizi') + '-' + userName + '-' + fileStamp());
    const blob = await new Promise((res) => cv.toBlob(res, 'image/png'));
    if (!blob) throw new Error('浏览器没能生成图片，请减少勾选的消息');
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = base + '.png';
    a.click();
    setTimeout(() => URL.revokeObjectURL(url), 4000);
    addNote(`已导出 1 张长图（${base}.png，${plan.w} × ${plan.h}）。`);
  } catch (e) {
    addMsg('error', '导出失败：' + (e.message || e));
  } finally {
    btn.disabled = false;
    btn.textContent = '导出图片';
    $('expGo').disabled = false;
    while (expUrls.length) URL.revokeObjectURL(expUrls.pop());
  }
}

async function loadModels() {
  try {
    const r = await fetch('/model');
    const d = await r.json();
    if (!Array.isArray(d.models)) return;
    const sel = $('modelSelect');
    if (sel.dataset.ready && sel.dataset.current === d.current) {
      // 已在展示，仅刷新 vision 名牌
      renderVision(d.vision);
      return;
    }
    sel.innerHTML = '';
    const list = d.models.slice();
    if (d.current && !list.some((m) => m.path === d.current)) {
      list.unshift({path: d.current, name: d.current.split('/').pop(),
                    vision: d.vision});
    }
    list.forEach((m) => {
      const opt = document.createElement('option');
      opt.value = m.path;
      opt.textContent = m.name + (m.vision ? ' · 多模态' : ' · 仅文本');
      sel.appendChild(opt);
    });
    if (d.current) sel.value = d.current;
    sel.dataset.current = d.current || '';
    sel.dataset.ready = '1';
    renderVision(d.vision);
  } catch (_) { /* 服务未就绪时忽略 */ }
}

function renderVision(v) {
  $('visionPill').textContent = v ? '多模态' : '仅文本';
  $('visionPill').className = v ? 'vision-pill v' : 'vision-pill no';
}

$('modelSelect').addEventListener('change', async (e) => {
  const sel = e.target;
  const target = sel.value;
  const prev = sel.dataset.current || '';
  if (!target || target === prev) { sel.value = prev; return; }
  try {
    const r = await fetch('/model', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({model: target}),
    });
    const d = await r.json();
    if (!r.ok) throw new Error(d.error || ('HTTP ' + r.status));
    addMsg('bot', `（已切换到模型 ${d.model.split('/').pop()}${d.vision ? ' · 多模态' : ' · 仅文本'}，重新加载中…）`, null, null, true);
    sel.dataset.current = d.model || '';
    health();
  } catch (err) {
    sel.value = prev;
    addMsg('error', '切换模型失败：' + (err.message || err));
  }
});

function renderUsers() {
  const sel = $('userId');
  const list = userList.slice();
  if (userName && !list.includes(userName)) list.push(userName);
  sel.innerHTML = '';
  list.forEach((u) => {
    const opt = document.createElement('option');
    opt.value = u;
    opt.textContent = u;
    sel.appendChild(opt);
  });
  const add = document.createElement('option');
  add.value = NEW_USER;
  add.textContent = NEW_USER;
  sel.appendChild(add);
  sel.value = userName;
  localStorage.setItem('zhizi_user_id', userName);
}

async function loadUsers() {
  try {
    const r = await fetch('/users');
    const d = await r.json();
    if (!Array.isArray(d.users)) return;
    const sel = $('userId');
    const sig = [d.users, extraUsers, userName].join(' ');
    if (sel.dataset.sig === sig) return;  // 清单没变：不动 DOM，避免打断正在操作的下拉
    sel.dataset.sig = sig;
    userList = d.users;
    renderUsers();
    loadHistory();
  } catch (_) { /* 服务未就绪时忽略 */ }
}

async function loadChars() {
  try {
    const r = await fetch('/characters');
    const d = await r.json();
    if (!Array.isArray(d.characters)) return;
    const sel = $('charSelect');
    sel.innerHTML = '';
    d.characters.forEach((c) => {
      const opt = document.createElement('option');
      opt.value = c.name;
      opt.textContent = c.name + (c.default ? '（默认）' : '');
      sel.appendChild(opt);
    });
    if (charName && Array.from(sel.options).some((o) => o.value === charName)) {
      sel.value = charName;
    }
    charName = sel.value || '';
    localStorage.setItem('zhizi_character', charName);
    loadHistory();
  } catch (_) { /* 服务未就绪时忽略 */ }
}

async function health() {
  try {
    const r = await fetch('/health');
    const d = await r.json();
    $('live').className = 'dot on';
    if (d.model) $('modelSelect').dataset.current = d.model || '';
    vision = !!d.vision;
    pickEl.title = vision
      ? '上传图片（当前模型支持多模态，发送后她能看到）'
      : '上传图片（当前模型不支持多模态，仅本地预览）';
  } catch (_) {
    $('live').className = 'dot off';
  }
}
health();
loadModels();
loadChars();
loadUsers();
loadHistory();   // 打开页面：拉该 user_id × 角色的既有聊天记录（loadChars 定下角色后会校正一次）
setInterval(() => { health(); loadModels(); loadChars(); loadUsers(); }, 5000);
inputEl.focus();
</script>
</body>
